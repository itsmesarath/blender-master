name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLENDER_VERSION: "5.2.3"
      BLENDER_SERIES: "5.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64-v1

      - name: Download and verify Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          file="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 3 -o "/tmp/${file}" "${base}/${file}"
          curl -fsSL --retry 3 -o /tmp/blender.sha256 "${base}/blender-${BLENDER_VERSION}.sha256"
          (cd /tmp && grep " ${file}\$" blender.sha256 | sha256sum -c -)
          mkdir -p "$HOME/blender"
          tar -xJf "/tmp/${file}" -C "$HOME/blender"

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6

      - name: Point BLENDER_BIN at the binary
        run: |
          echo "BLENDER_BIN=$HOME/blender/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Blender version
        run: '"$BLENDER_BIN" -b --factory-startup --version'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Unit and sub-skill tests
        run: python -m pytest -v -m "not slow"

      - name: Example projects end to end
        run: python -m pytest -v -m slow

      - name: Upload test renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/_output/
          if-no-files-found: ignore
          retention-days: 7
